<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>信用卡 Dashboard</title>
<style>:root{font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;color:#172033;background:#f5f7fb}body{margin:0}.wrap{max-width:1100px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap}.muted{color:#667085;font-size:.9rem}.card,section{background:#fff;border:1px solid #e5e9f0;border-radius:14px;padding:16px;box-shadow:0 2px 10px #1018280d}.login{max-width:420px;margin:12vh auto}.login input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #d0d5dd;border-radius:8px;margin:10px 0}.button{border:0;background:#3659d9;color:white;border-radius:8px;padding:11px 16px;font-weight:600}.error{color:#b42318}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}.value{font-size:1.55rem;font-weight:700;margin-top:6px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}section{margin-bottom:14px}h1{margin:0 0 6px}h2{font-size:1.05rem;margin:0 0 12px}table{border-collapse:collapse;width:100%;font-size:.88rem}th,td{text-align:left;padding:8px 6px;border-bottom:1px solid #eef1f5}th{color:#667085}.right{text-align:right}.bar{height:9px;background:#e8edf5;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:#5b7cfa}.badge{padding:3px 7px;border-radius:99px;background:#eef4ff;color:#2455c3;font-size:.78rem}.warning{background:#fff7e6;color:#9a6700}.hidden{display:none}@media(max-width:760px){.cards{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.wrap{padding:12px}table{font-size:.76rem}th,td{padding:7px 3px}.hide-mobile{display:none}}
</style></head><body><main class="wrap"><div id="login" class="login card"><h1>信用卡 Dashboard</h1><p class="muted">資料是加密包；密碼只在此瀏覽器記憶體使用，不會送到 GitHub。</p><input id="pass" type="password" autocomplete="current-password" placeholder="Dashboard passphrase"><button class="button" id="unlock">解鎖 Dashboard</button><p id="err" class="error"></p></div><div id="app" class="hidden"><div class="top"><div><h1>信用卡消費 Dashboard</h1><div class="muted">GitHub Pages · 明文資料不在網站上</div></div><label>帳單月份 <select id="month"></select></label></div><div id="cards" class="cards"></div><div class="grid"><section><h2>各銀行消費</h2><div id="banks"></div></section><section><h2>消費分類</h2><div id="categories"></div></section></div><section><h2>正式帳單對帳</h2><div id="reconcile"></div></section><section><h2>交易明細</h2><div id="transactions"></div></section></div></main>
<script>
let data;
const money=n=>new Intl.NumberFormat('zh-TW',{style:'currency',currency:'TWD',maximumFractionDigits:0}).format(n);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function b64(s){const x=atob(s);return Uint8Array.from(x,c=>c.charCodeAt(0))}
async function unlock(){const err=document.querySelector('#err');err.textContent='';try{const enc=await fetch('./data.enc.json',{cache:'no-store'}).then(r=>r.json());const keyMaterial=await crypto.subtle.importKey('raw',new TextEncoder().encode(document.querySelector('#pass').value),'PBKDF2',false,['deriveKey']);const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(enc.salt),iterations:enc.iterations,hash:'SHA-256'},keyMaterial,{name:'AES-GCM',length:256},false,['decrypt']);const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(enc.iv),additionalData:new TextEncoder().encode(enc.aad)},key,b64(enc.ciphertext));data=JSON.parse(new TextDecoder().decode(plain));document.querySelector('#login').classList.add('hidden');document.querySelector('#app').classList.remove('hidden');const sel=document.querySelector('#month');sel.innerHTML=data.summary.months.map(m=>`<option>${esc(m)}</option>`).join('');sel.onchange=render;render()}catch(e){err.textContent='解鎖失敗：密碼錯誤或資料包尚未發布。'}}
function render(){const m=document.querySelector('#month').value,s=data.summary.by_month[m]||{gross:0,credits:0,net:0,pending:0,banks:[],categories:[]};document.querySelector('#cards').innerHTML=[['毛消費',money(s.gross)],['退款／折抵',money(s.credits)],['淨消費',money(s.net)],['待確認筆數',s.pending+' 筆']].map(x=>`<div class="card"><div class="muted">${x[0]}</div><div class="value">${x[1]}</div></div>`).join('');const max=Math.max(...s.banks.map(x=>x.amount),1);document.querySelector('#banks').innerHTML=s.banks.map(x=>`<p><b>${esc(x.bank)}</b><span class="right" style="float:right">${money(x.amount)}</span></p><div class="bar"><i style="width:${x.amount/max*100}%"></i></div>`).join('');const cmax=Math.max(...s.categories.map(x=>x.amount),1);document.querySelector('#categories').innerHTML=s.categories.map(x=>`<p><b>${esc(x.category)}</b><span class="right" style="float:right">${money(x.amount)}</span></p><div class="bar"><i style="width:${x.amount/cmax*100}%"></i></div>`).join('');const totals=data.summary.statement_totals.filter(x=>x.statement_month===m);document.querySelector('#reconcile').innerHTML=`<table><thead><tr><th>銀行</th><th class="right">正式應繳</th><th class="right">明細淨額</th><th class="right">差額</th></tr></thead><tbody>${totals.map(x=>`<tr><td>${esc(x.bank)}</td><td class="right">${money(x.statement_total)}</td><td class="right">${money(x.ledger_net)}</td><td class="right">${money(x.delta)}</td></tr>`).join('')}</tbody></table>`;const rows=data.transactions.filter(x=>x.statement_month===m);document.querySelector('#transactions').innerHTML=`<table><thead><tr><th>日期</th><th>銀行</th><th>商店</th><th>分類</th><th class="right">金額</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${esc(x.transaction_date)}</td><td>${esc(x.bank)} · ${esc(x.card_suffix)}</td><td>${esc(x.merchant)}</td><td>${esc(x.category)}</td><td class="right">${money(x.amount)}</td></tr>`).join('')}</tbody></table>`}
document.querySelector('#unlock').onclick=unlock;document.querySelector('#pass').onkeydown=e=>{if(e.key==='Enter')unlock()};
</script></body></html>
